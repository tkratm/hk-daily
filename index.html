<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>港股投资打卡 · 辛先生</title>
<style>
:root{
  --bg:#f6f5f3; --card:#fff; --text:#1a1a1a; --text2:#777;
  --accent:#c41e3a; --accent-l:#fef0f2; --green:#2e7d32; --green-l:#e8f5e9;
  --blue:#1565c0; --blue-l:#e3f2fd; --orange:#e65100; --orange-l:#fff3e0;
  --border:#e6e4e0; --shadow:0 1px 3px rgba(0,0,0,.05);
  --radius:12px; --safe-b:env(safe-area-inset-bottom,16px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; font-size:15px;
  -webkit-font-smoothing:antialiased; padding-bottom:calc(68px + var(--safe-b));
  max-width:560px; margin:0 auto; min-height:100vh;
}
.header{
  position:sticky; top:0; z-index:100; background:var(--bg);
  padding:16px 16px 8px; display:flex; align-items:center; justify-content:space-between;
}
.header h1{font-size:18px;font-weight:700}
.header .streak{
  font-size:12px;color:var(--accent);background:var(--accent-l);
  padding:4px 12px;border-radius:20px;font-weight:600;
  display:flex;align-items:center;gap:4px;
}
.header-right{display:flex;align-items:center;gap:6px}
.sync-badge{
  font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;
  display:inline-flex;align-items:center;gap:3px;cursor:pointer;
}
.sync-badge.online{background:var(--green-l);color:var(--green)}
.sync-badge.offline{background:#fff3e0;color:var(--orange)}
.sync-badge.error{background:var(--accent-l);color:var(--accent)}
.settings-btn{
  font-size:16px;padding:3px 8px;cursor:pointer;background:none;border:none;
  border-radius:6px;-webkit-tap-highlight-color:transparent;
}
.settings-btn:active{background:#f0eeea}

.tab-content{display:none;padding:0 16px}
.tab-content.active{display:block}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);
}
.card-sm{padding:14px 16px;margin-bottom:10px}
.card-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
}
.card-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-sub{font-size:12px;color:var(--text2)}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);
}
.stat-item .v{font-size:22px;font-weight:700}
.stat-item .v.red{color:var(--accent)}.stat-item .v.green{color:var(--green)}.stat-item .v.blue{color:var(--blue)}
.stat-item .l{font-size:12px;color:var(--text2);margin-top:2px}

.check-item{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid #f0eeea;cursor:pointer;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.check-item:last-child{border-bottom:none}
.check-item .box{
  width:22px;height:22px;border:2px solid #ccc;border-radius:6px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-size:12px;
}
.check-item.done .box{background:var(--green);border-color:var(--green);color:#fff}
.check-item .info{flex:1;min-width:0}
.check-item .info .name{font-size:14px;font-weight:600}
.check-item .info .hint{font-size:12px;color:var(--text2);margin-top:2px}
.check-item .time{font-size:11px;color:#bbb;white-space:nowrap}

.habit-group{margin-bottom:18px}
.habit-group .group-title{
  font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px;
}
.habit-group .group-title .dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.dot-red{background:var(--accent)}.dot-blue{background:var(--blue)}.dot-green{background:var(--green)}.dot-orange{background:var(--orange)}

.journal-entry{
  padding:14px 0;border-bottom:1px solid #f0eeea;
}
.journal-entry:last-child{border-bottom:none}
.journal-entry .j-date{font-size:12px;color:var(--text2);margin-bottom:8px}
.journal-entry .j-line{
  font-size:14px;padding:4px 0;padding-left:8px;border-left:3px solid var(--accent-l);
  margin-bottom:6px;display:flex;gap:6px;
}
.journal-entry .j-line .j-label{font-size:12px;color:var(--text2);white-space:nowrap;min-width:48px}
.journal-entry .j-line .j-text{flex:1}

.empty-state{
  text-align:center;padding:40px 20px;color:var(--text2);
}
.empty-state .icon{font-size:40px;margin-bottom:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;
  border:none;cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:#a01830}
.btn-outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-outline:active{background:var(--accent-l)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:6px}
.btn-full{width:100%;justify-content:center}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s;
}
.modal{
  background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:560px;
  max-height:85vh;overflow-y:auto;padding:20px;
  animation:slideUp .25s;
}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}
.modal textarea,.modal input{
  width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;resize:vertical;outline:none;
  background:#fafaf8;
}
.modal textarea:focus,.modal input:focus{border-color:var(--accent)}
.modal textarea{min-height:60px}
.modal .field{margin-bottom:14px}
.modal .field label{font-size:13px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px}
.modal .field .hint-text{font-size:11px;color:#bbb;margin-top:4px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns .btn{flex:1}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.rule-item{
  display:flex;align-items:flex-start;gap:12px;padding:12px 0;
  border-bottom:1px solid #f0eeea;
}
.rule-item:last-child{border-bottom:none}
.rule-num{
  width:28px;height:28px;border-radius:50%;background:#f0eeea;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;color:var(--text2);
}
.rule-text{font-size:14px;flex:1;line-height:1.5}
.rule-item.violated .rule-num{background:var(--accent-l);color:var(--accent)}
.rule-item .violate-btn{
  font-size:11px;color:var(--text2);white-space:nowrap;padding:4px 10px;
  border:1px solid var(--border);border-radius:20px;cursor:pointer;background:none;
  -webkit-tap-highlight-color:transparent;
}
.rule-item .violate-btn:active{background:#f5f5f5}

.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;background:var(--card);
  border-top:1px solid var(--border);display:flex;z-index:150;
  padding-bottom:var(--safe-b);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 0 4px;cursor:pointer;color:#bbb;font-size:10px;
  -webkit-tap-highlight-color:transparent;transition:color .15s;gap:3px;
}
.nav-item .nicon{font-size:20px;line-height:1}
.nav-item.active{color:var(--accent);font-weight:600}

.tag{
  display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;
}
.tag-red{background:var(--accent-l);color:var(--accent)}
.tag-green{background:var(--green-l);color:var(--green)}
.tag-blue{background:var(--blue-l);color:var(--blue)}
.tag-orange{background:var(--orange-l);color:var(--orange)}
.tag-gray{background:#f0eeea;color:#999}

.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;
  background:#1a1a1a;color:#fff;padding:10px 24px;border-radius:20px;
  font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;
}
.toast.show{opacity:1}

.timeline-item{
  position:relative;padding-left:28px;padding-bottom:16px;
}
.timeline-item::before{
  content:'';position:absolute;left:8px;top:6px;width:10px;height:10px;border-radius:50%;
  border:2px solid var(--border);background:var(--bg);
}
.timeline-item::after{
  content:'';position:absolute;left:12px;top:18px;bottom:0;width:1px;background:var(--border);
}
.timeline-item:last-child::after{display:none}
.timeline-item.done::before{background:var(--green);border-color:var(--green)}
.timeline-item.active::before{background:var(--accent);border-color:var(--accent)}
.timeline-item .tl-date{font-size:11px;color:var(--text2);margin-bottom:2px}
.timeline-item .tl-title{font-size:14px;font-weight:600}
.timeline-item .tl-desc{font-size:12px;color:var(--text2);margin-top:2px}

.progress-bar{
  height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:8px 0;
}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .4s}
.fill-red{background:var(--accent)}.fill-green{background:var(--green)}.fill-blue{background:var(--blue)}

.setup-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.setup-card{
  background:var(--card);border-radius:16px;padding:28px 22px;max-width:420px;width:100%;
  box-shadow:0 8px 40px rgba(0,0,0,.15);animation:fadeIn .3s;
}
.setup-card h2{font-size:20px;font-weight:700;margin-bottom:6px}
.setup-card .sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.setup-card .step{
  padding:12px 16px;background:#fafaf8;border-radius:10px;margin-bottom:12px;
  border-left:3px solid var(--accent);font-size:13px;line-height:1.7;
}
.setup-card .step .step-num{font-weight:700;color:var(--accent)}
.setup-card input{
  width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;font-family:monospace;outline:none;background:#fafaf8;margin-bottom:10px;
}
.setup-card input:focus{border-color:var(--accent)}
.setup-card .test-result{font-size:12px;margin:8px 0;padding:8px 12px;border-radius:6px}
.setup-card .test-result.ok{background:var(--green-l);color:var(--green)}
.setup-card .test-result.fail{background:var(--accent-l);color:var(--accent)}

@media(min-width:560px){
  .header{padding:20px 8px 12px}
  .tab-content{padding:0 8px}
}
</style>
</head>
<body>

<div class="header">
  <h1>📈 港股投资打卡</h1>
  <div class="header-right">
    <span class="sync-badge" id="syncBadge" onclick="forceSync()">⟳</span>
    <button class="settings-btn" onclick="openSettings()" title="设置">⚙</button>
    <div class="streak" id="streakBadge">🔥 <span id="streakCount">0</span> 天</div>
  </div>
</div>

<!-- SETUP OVERLAY (shown on first visit) -->
<div id="setupOverlay" style="display:none"></div>

<!-- ===== DASHBOARD ===== -->
<div class="tab-content active" id="tab-dashboard">
  <div class="stats-grid">
    <div class="stat-item">
      <div class="v blue" id="statLearning">0%</div>

    </div>
    <div class="stat-item">
      <div class="v green" id="statHabits">0</div>

    </div>

    </div>

  <div class="card" style="margin-top:14px">
    <div class="card-header">

    <div id="todayChecklist"></div>

  <div class="card">

</div>

<!-- ===== CHECKIN ===== -->
<div class="tab-content" id="tab-checkin">
  <div class="card">
    <div class="card-header">

    <div class="habit-group">
      <div class="group-title"><span class="dot dot-green"></span>工具掌握（3项）</div>

    </div>

      <div class="group-title"><span class="dot dot-orange"></span>模拟交易目标（30笔）</div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">⚡ 每日习惯</div>

<!-- ===== JOURNAL ===== -->
<div class="tab-content" id="tab-journal">
  <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn btn-primary btn-sm" onclick="openJournalModal()">✏️ 写日志</button>
    <button class="btn btn-outline btn-sm" onclick="openWeeklyModal()">📈 周复盘</button>

  <div id="journalList">

</div>

<!-- ===== DISCIPLINE ===== -->
<div class="tab-content" id="tab-discipline">

    <div class="card-header">

<!-- ===== BOTTOM NAV ===== -->
<div class="bottom-nav">

    <span class="nicon">🛡</span>纪律

<script>
// ==================== GITHUB CONFIG ====================
function getGhConfig(){
  return {
    token: localStorage.getItem('hk_gh_token') || '',
    repo: localStorage.getItem('hk_gh_repo') || '',
    path: localStorage.getItem('hk_gh_path') || 'data.json',
  };
}

function hasGhConfig(){
  const c = getGhConfig();
  return !!(c.token && c.repo);
}

// ==================== GITHUB API ====================
async function ghApi(method, cfg, body){
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path}`;
  const headers = {
    'Authorization': `Bearer ${cfg.token}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json',
  };
  const opts = { method, headers };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw { status: res.status, message: err.message || res.statusText };
  }
  return res.json();
}

// ==================== DATA LAYER ====================
const LS_KEY = 'hk_guide_data';
let useGithub = false;
let _ghSha = null; // stored sha for updates

function defaultData(){
  return {
    learning: {
      books: [
        {id:'b1',name:'《聪明的投资者》',hint:'重点：第8章+第20章',done:false,doneAt:null},
        {id:'b2',name:'《投资中最简单的事》',hint:'邱国鹭·中文语境港股案例',done:false,doneAt:null},
        {id:'b3',name:'《巴菲特致股东的信》',hint:'重点：1987/2000/2008年份',done:false,doneAt:null},
        {id:'b4',name:'《行为投资学手册》',hint:'詹姆斯·蒙蒂尔·行为金融',done:false,doneAt:null},
      ],
      docs: [
        {id:'d1',name:'《成为沃伦·巴菲特》',hint:'HBO 2017·复利思维',done:false,doneAt:null},
        {id:'d2',name:'《大空头》',hint:'大多数人错在哪里',done:false,doneAt:null},
        {id:'d3',name:'《华尔街之狼》',hint:'反面教材·不信稳赚不赔',done:false,doneAt:null},
        {id:'d4',name:'《安然：房间里最聪明的人》',hint:'财报造假经典案例',done:false,doneAt:null},
      ],
      tools: [
        {id:'t1',name:'模拟交易账户开通',hint:'富途/盈立/老虎·虚拟资金练3个月',done:false,doneAt:null},
        {id:'t2',name:'港交所披露易 (hkexnews.hk)',hint:'能独立查找公司公告',done:false,doneAt:null},
        {id:'t3',name:'数据终端日常使用',hint:'富途牛牛/TradingView 每日固定使用',done:false,doneAt:null},
      ],
      simTrades:{done:0,target:30}
    },
    habits:{},
    journal:[],
    weekly:[],
    monthly:[],
    discipline:[],
  };
}

function lsLoad(){
  const raw = localStorage.getItem(LS_KEY);
  if(!raw) return defaultData();
  try{ return JSON.parse(raw); }catch(e){ return defaultData(); }
}
function lsSave(data){ localStorage.setItem(LS_KEY, JSON.stringify(data)); }

async function githubLoad(){
  const cfg = getGhConfig();
  try{
    const result = await ghApi('GET', cfg);
    _ghSha = result.sha;
    const content = JSON.parse(atob(result.content));
    useGithub = true;
    return content;
  }catch(e){
    if(e.status === 404){
      // File doesn't exist yet — use local data, will create on first save
      useGithub = true;
      _ghSha = null;
      return lsLoad();
    }
    console.warn('GitHub load failed:', e);
    useGithub = false;
    return lsLoad();
  }
}

async function githubSave(data){
  const cfg = getGhConfig();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = {
    message: `Update data — ${new Date().toLocaleString('zh-CN')}`,
    content: content,
  };
  if(_ghSha) body.sha = _ghSha;

  try{
    const result = await ghApi('PUT', cfg, body);
    _ghSha = result.content.sha;
    lsSave(data);
    updateSyncBadge('online', '已同步');
    return true;
  }catch(e){
    if(e.status === 409){
      // Conflict — reload and merge
      console.warn('Conflict detected, reloading...');
      const remote = await githubLoad();
      if(remote){
        // Simple merge: remote wins for most fields, but preserve local journal entries not in remote
        const merged = mergeData(remote, data);
        _ghSha = null;
        return githubSave(merged);
      }
    }
    console.warn('GitHub save failed:', e);
    lsSave(data);
    updateSyncBadge('error', '同步失败');
    return false;
  }
}

function mergeData(remote, local){
  // Merge: keep all local journal entries that don't exist in remote (by createdAt)
  const remoteIds = new Set(remote.journal.map(j=>j.createdAt));
  const localOnly = local.journal.filter(j=>!remoteIds.has(j.createdAt));
  remote.journal = [...remote.journal, ...localOnly];
  // Merge habits: local takes priority (more recent)
  for(const [date, habits] of Object.entries(local.habits||{})){
    if(!remote.habits[date]) remote.habits[date] = {};
    for(const [k,v] of Object.entries(habits)){
      if(v) remote.habits[date][k] = v;
    }
  }
  // Merge learning: done=true wins
  for(const cat of ['books','docs','tools']){
    for(let i=0;i<(local.learning[cat]||[]).length;i++){
      if(local.learning[cat][i]?.done && remote.learning[cat]?.[i]){
        remote.learning[cat][i].done = true;
        if(local.learning[cat][i].doneAt) remote.learning[cat][i].doneAt = local.learning[cat][i].doneAt;
      }
    }
  }
  if(local.learning.simTrades?.done > (remote.learning.simTrades?.done||0)){
    remote.learning.simTrades.done = local.learning.simTrades.done;
  }
  // Merge discipline
  const discIds = new Set(remote.discipline.map(d=>d.createdAt));
  const discOnly = local.discipline.filter(d=>!discIds.has(d.createdAt));
  remote.discipline = [...remote.discipline, ...discOnly];
  // Merge weekly/monthly
  for(const key of ['weekly','monthly']){
    const rid = new Set(remote[key].map(d=>d.createdAt));
    remote[key] = [...remote[key], ...local[key].filter(d=>!rid.has(d.createdAt))];
  }
  return remote;
}

function escapeHtml(s){

async function testGhConnection(){
  const token = document.getElementById('sToken').value.trim();
  const repo = document.getElementById('sRepo').value.trim();
  const path = document.getElementById('sPath').value.trim() || 'data.json';
  const resultEl = document.getElementById('testResult');

  if(!token || !repo){
    resultEl.innerHTML = '<div class="test-result fail">请填写 Token 和仓库名</div>';
    return;
  }

  resultEl.innerHTML = '<div style="font-size:12px;color:var(--text2);padding:8px">⏳ 测试中...</div>';

  try{
    const cfg = { token, repo, path };
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    const res = await fetch(url, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
      }
    });
    if(res.status === 404){
      resultEl.innerHTML = '<div class="test-result ok">✅ 连接成功！仓库已就绪，首次保存时会自动创建文件</div>';
    }else if(res.ok){
      resultEl.innerHTML = '<div class="test-result ok">✅ 连接成功！找到已有数据文件</div>';
    }else if(res.status === 401){
      resultEl.innerHTML = '<div class="test-result fail">❌ Token 无效或已过期</div>';
    }else if(res.status === 403){
      resultEl.innerHTML = '<div class="test-result fail">❌ 权限不足：Token 需要勾选 repo 权限</div>';
    }else{
      const err = await res.json().catch(()=>({}));
      resultEl.innerHTML = `<div class="test-result fail">❌ 错误: ${err.message || res.statusText}</div>`;
    }
  }catch(e){
    resultEl.innerHTML = `<div class="test-result fail">❌ 网络错误: ${e.message}</div>`;
  }
}

const today = () => new Date().toISOString().slice(0,10);
const fmtDate = (d) => { const dt = new Date(d); return `${dt.getMonth()+1}/${dt.getDate()}`; };
const fmtFull = (d) => { const dt = new Date(d); return `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`; };
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1800);
}

function calcStreak(){
  const habits = DATA.habits;
  let streak = 0;
  const d = new Date();
  d.setDate(d.getDate() - 1);
  while(true){
    const key = d.toISOString().slice(0,10);
    const h = habits[key];
    if(!h) break;
    const done = [h.morning, h.noTrade, h.journal].filter(Boolean).length;
    if(done < 3) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  const todayKey = today();
  const todayH = habits[todayKey];
  if(todayH){
    const todayDone = [todayH.morning, todayH.noTrade, todayH.journal].filter(Boolean).length;
    if(todayDone >= 3) streak++;
  }
  return streak;
}

function calcLearningPct(){
  const l = DATA.learning;
  const total = l.books.length + l.docs.length + l.tools.length;
  let done = l.books.filter(b=>b.done).length + l.docs.filter(d=>d.done).length + l.tools.filter(t=>t.done).length;
  return Math.round((done/total)*100);
}

function calcHabitCountThisMonth(){
  const now = new Date();
  const month = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let count = 0;
  for(const [date, h] of Object.entries(DATA.habits)){
    if(date.startsWith(month)){
      count += [h.morning, h.noTrade, h.noon, h.journal, h.water].filter(Boolean).length;
    }
  }
  return count;
}

async function saveWeekly(){
  const review = document.getElementById('wReview').value.trim();
  const next = document.getElementById('wNext').value.trim();
  if(!review && !next){ toast('至少写一项'); return; }
  DATA.weekly.push({date:getWeekKey(),week:`W${Math.ceil(new Date().getDate()/7)}`,review,next,createdAt:new Date().toISOString()});
  await saveData();
  closeModal();
  refreshActiveTab();
  toast('✅ 周复盘已保存');
}

let _selectedEmotion = '';
function openMonthlyModal(){
  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">💰 月度检视</div>
        <div class="field"><label>本月净值变化</label><input id="mNetValue" placeholder="如：+3.2% 或 -1.5%"></div>
        <div class="field"><label>仓位再平衡情况</label><textarea id="mAllocation" placeholder="有没有单只超过25%？现金比例是否>10%？"></textarea></div>
        <div class="field"><label>本月投资情绪</label>
          <div style="display:flex;gap:8px;margin-top:6px" id="emotionPicker">
            <button class="btn btn-sm btn-outline" onclick="selectEmotion('贪婪')" style="flex:1">😤 贪婪</button>
            <button class="btn btn-sm btn-outline" onclick="selectEmotion('恐惧')" style="flex:1">😨 恐惧</button>
            <button class="btn btn-sm btn-outline" onclick="selectEmotion('平静')" style="flex:1">😌 平静</button>
          </div>
          <input type="hidden" id="mEmotion" value="">
        </div>
        <div class="modal-btns">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveMonthly()">保存</button>
        </div>
      </div>
    </div>`;
}

function selectEmotion(e){
  _selectedEmotion = e;
  document.getElementById('mEmotion').value = e;
  const btns = document.querySelectorAll('#emotionPicker button');
  btns.forEach(b=>{b.classList.remove('btn-primary');b.classList.add('btn-outline');});
  event.target.classList.remove('btn-outline');
  event.target.classList.add('btn-primary');
}

async function saveMonthly(){
  const netValue = document.getElementById('mNetValue').value.trim();
  const allocation = document.getElementById('mAllocation').value.trim();
  const emotion = _selectedEmotion;
  if(!netValue && !allocation && !emotion){ toast('至少填一项'); return; }
  DATA.monthly.push({date:getMonthKey(),month:`${new Date().getMonth()+1}月`,netValue,allocation,emotion,createdAt:new Date().toISOString()});
  await saveData();
  closeModal(); _selectedEmotion = '';
  refreshActiveTab();
  toast('✅ 月度检视已保存');
}

function closeModal(){ document.getElementById('modalContainer').innerHTML = ''; _selectedEmotion = ''; }

// ==================== DISCIPLINE ====================
function renderDiscipline(){
  const rules = [
    '单只股票不超过总资金 20%','永远保留 10% 现金','亏损超 20% 无条件止损',
    '9:30-10:30 不做任何交易','每次下单前，先喝一杯水，等10分钟',
    '买入前必须写出三条理由（不是"会涨"）','不融资、不杠杆��不借钱炒股',
    '每周日复盘，每月1号再平衡','不在社交媒体上公开讨论具体持仓',
    '年亏损超15%，停止交易1个月反思',
  ];
  const violations = DATA.discipline;
  const hasViolation = violations.length > 0;
  document.getElementById('disciplineStatus').textContent = hasViolation ? '⚠ 有违规' : '守纪中';
  document.getElementById('disciplineStatus').className = 'tag ' + (hasViolation ? 'tag-orange' : 'tag-green');

  document.getElementById('disciplineRules').innerHTML = rules.map((r,i)=>{
    const vRecord = violations.filter(v=>v.ruleId===i);
    const violated = vRecord.length > 0;
    return `<div class="rule-item ${violated?'violated':''}">
      <div class="rule-num">${i+1}</div>
      <div class="rule-text">${r}${violated?`<br><span style="font-size:11px;color:var(--accent)">⚠ 违规 ${vRecord.length} 次</span>`:''}</div>
      <button class="violate-btn" onclick="reportViolation(${i})">📝</button>
    </div>`;
  }).join('');

  const dontBuy = ['亏损的科技公司（不知道何时盈利）','日均成交额低于1000万港币的票','大股东持续减持的股票','有合股/供股历史的公司（老千股）','靠"概念"炒作的票（元宇宙、Web3）','不理解业务模式的公司','因"跌多了"就买（≠ 被低估）','因"别人推荐"就买'];
  document.getElementById('dontBuyList').innerHTML = dontBuy.map(d=>`
    <div class="check-item" style="cursor:default">
      <div class="box" style="border-color:var(--accent);color:var(--accent)">✕</div>
      <div class="info"><div class="name" style="font-size:13px;font-weight:400">${d}</div></div>
    </div>`).join('');
}

async function reportViolation(ruleId){
  const note = prompt('简单记录违规情况（可选）：');
  if(note === null) return;
  DATA.discipline.push({ruleId,date:today(),note:note||'',createdAt:new Date().toISOString()});
  await saveData();
  renderDiscipline();
  toast('⚠ 违规已记录');
}

// ==================== TAB NAVIGATION ====================
let activeTab = 'dashboard';
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  refreshActiveTab();
}

async function refreshActiveTab(){
  if(activeTab==='dashboard') renderDashboard();
  else if(activeTab==='checkin') renderCheckin();
  else if(activeTab==='journal') renderJournal();
  else if(activeTab==='discipline') renderDiscipline();
}

// ==================== INIT ====================
async function init(){
  await initData();

  refreshActiveTab();
}

init();
</script>
